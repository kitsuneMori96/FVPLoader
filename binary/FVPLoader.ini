; FVPLoader per-game configuration
;
; Keep this file next to FVPKernel.dll, i.e. in the directory the loader is
; started from. FVPLoaderGui.exe edits it for you when you pick an entry from
; the Encoding list in the loader window.
;
; CodePage decides how the game's ANSI strings are converted to and from
; UTF-16 and which font charset the GDI hooks force. Supported values:
;
;   932     Japanese (Shift-JIS)       - the original hardcoded behaviour
;   936     Simplified Chinese (GBK)
;   950     Traditional Chinese (Big5)
;   949     Korean (UHC)
;   1252    Western European (Latin-1)
;   65001   Unicode (UTF-8)
;
; Any other value is handed to the Win32 conversion APIs as-is; the charset
; then defaults to DEFAULT_CHARSET and no script name is reported.
;
; Charset, LocaleID and ScriptName are optional overrides. They default to the
; values belonging to CodePage, so most games only need CodePage.
;
[Encoding]
CodePage=932
